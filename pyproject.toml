[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investai"
version = "0.1.0"
description = "Assistente de investimentos que lê sua carteira, busca dados reais de mercado e usa o Claude para escrever um briefing fundamentado"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Igor Cruz" }]
keywords = ["investimentos", "b3", "yfinance", "claude", "anthropic", "whatsapp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "anthropic==1.13.0",
    "fastapi==0.143.0",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "psycopg[binary,pool]==3.3.6",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "uvicorn==0.54.0",
    "yfinance==1.7.0",
]

[project.optional-dependencies]
# Interface local em Streamlit. Fora do núcleo porque a VM tem 1 GB de RAM e
# nunca executa Streamlit — não paga por ele em disco nem em tempo de import.
dashboard = ["plotly==7.1.0", "streamlit==1.65.0"]
dev = ["pytest==9.1.1", "ruff==0.14.0"]

[project.urls]
Homepage = "https://github.com/IgorCruz-dev/investai"
Repository = "https://github.com/IgorCruz-dev/investai"
Issues = "https://github.com/IgorCruz-dev/investai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "network: teste que depende de APIs externas reais (pode ser pulado se a rede/API estiver indisponível)",
    "paid: teste que consome créditos de API paga (desativado por padrão)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # o comprimento de linha é guia, não erro: quebrar uma f-string de
             # mensagem ao usuário no meio costuma piorar a leitura
    "B008",  # Depends() no default de parâmetro é o idioma do FastAPI
]
